site_name: InstitutionKit Documentation
site_description: Complete Multi-Campus School Management ERP for WordPress
site_author: Kashif Mukhtar
site_url: https://institutionkit.com/docs
copyright: Copyright &copy; 2008-2026 Kashif Mukhtar

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github
  logo: assets/ik-logo.svg
  favicon: assets/favicon.png

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4

plugins:
  - search
  - with-pdf:
      cover_title: InstitutionKit Documentation
      cover_subtitle: Complete Multi-Campus School Management ERP
      cover_logo: assets/ik-logo.png
      output_path: institutionkit-manual.pdf
      enabled_if_env: ENABLE_PDF_EXPORT
  - minify:
      minify_html: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/wordpress
      link: https://institutionkit.com
      name: InstitutionKit Website

